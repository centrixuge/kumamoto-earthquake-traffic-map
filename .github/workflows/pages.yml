name: Build and deploy GitHub Pages

# 解説ページ（site/）を data/ から生成して公開する。
# main が更新されるたびに走らせるのは、掲載している観測点数・行数・
# 収録期間・車種別の平常比をデータから計算しているため。
# 6時間ごとの自動取得（fetch-and-archive.yml）が main を更新するので、
# ページの数字も同じ頻度で最新になる。
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 走っているデプロイを止めずに、後から来たものを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ページの生成に必要なのは parquet を読む分だけ。
      # geopandas 等を含む requirements-fetch.txt は入れない。
      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
