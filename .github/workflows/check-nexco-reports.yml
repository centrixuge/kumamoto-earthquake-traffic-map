name: Check NEXCO reports

on:
  schedule:
    # 日本時間の 9:00 と 19:00（UTCの 0:00 と 10:00）。
    # GitHub Actionsのcronは混み具合で数分〜十数分遅れることがある。
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  # 転記だけを載せる作業ブランチ。mainから切る。
  # developで作業すると、developに乗っている他の作業（モバイル空間統計の
  # 集計など）までPRの差分に入り、マージするとまとめてmainへ行ってしまう。
  WORK_BRANCH: auto/nexco-report

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # 開いているPRがあればその続き、無ければmainから切り直す。
      # 切り直すのは、マージ済み・放置のブランチが残っていたときに
      # 古いコミットを引きずらないため。
      - name: Prepare the working branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head "$WORK_BRANCH" --base main --state open --json number -q '.[].number')" ]; then
            echo "開いているPRがあるので、そのブランチに続けます"
            git fetch origin "$WORK_BRANCH"
            git switch "$WORK_BRANCH"
          else
            echo "mainから $WORK_BRANCH を切り直します"
            git switch -c "$WORK_BRANCH" origin/main
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PDF reader
        run: pip install pymupdf

      # 新しい報が出ていればPDFを保存する
      - name: Check NEXCO news releases
        id: check
        run: python scripts/check_nexco_reports.py | tee check.log

      # 読み取れる範囲（緊急車両の通行可能区間）だけをJSONに反映し、
      # 判断材料をPRの本文にまとめる。通行止めの追加・解除は触らない。
      - name: Apply the new reports
        if: steps.check.outputs.new_count != '0'
        env:
          # 確認用アプリ（PREVIEW_APP_URL）のURL。既定ではdevelopを映して
          # いるので、この作業ブランチの内容は出ない。出したい場合は
          # 確認用アプリの向き先を WORK_BRANCH に変える。
          PREVIEW_APP_URL: ${{ vars.PREVIEW_APP_URL }}
          PREVIEW_APP_BRANCH: ${{ vars.PREVIEW_APP_BRANCH }}
        run: |
          : > pr.md
          # 保存したPDFのパスは check_nexco_reports.py が new_reports.txt に
          # 書いている。git status で拾う作りにすると、取り直したPDFが既存と
          # 同一バイトのときに検出できない。
          while IFS= read -r pdf; do
            [ -z "$pdf" ] && continue
            echo "--- $pdf"
            python scripts/apply_nexco_report.py "$pdf" --summary part.md
            cat part.md >> pr.md
            echo "" >> pr.md
          done < new_reports.txt

      # mainへ直接コミットせず、作業ブランチに載せてプルリクエストにする。
      # 差分は転記した分だけなので、出先からでも中身を読んでマージできる。
      # マージしたあとは、developにもmainを取り込んで揃えておく。
      - name: Push and open a pull request
        if: steps.check.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nexco_west_regulations data/nexco_regulations.json
          git commit -m "NEXCO西日本の新しい報を反映（${{ steps.check.outputs.new_list }}）"
          # 切り直した場合は古いブランチを上書きする。PRの続きのときは
          # 追記なので、--force-with-lease でも通常のpushと同じ動きになる。
          git push --force-with-lease -u origin "$WORK_BRANCH"

          {
            echo ""
            echo "<details><summary>取得の実行ログ</summary>"
            echo ""
            echo '```'
            cat check.log
            echo '```'
            echo ""
            echo "</details>"
          } >> pr.md

          if [ -n "$(gh pr list --head "$WORK_BRANCH" --base main --state open --json number -q '.[].number')" ]; then
            # すでに開いているPRがあれば、そこに追記する（PRを増やさない）
            gh pr comment "$WORK_BRANCH" --body-file pr.md
          else
            gh pr create --base main --head "$WORK_BRANCH" \
              --title "NEXCO西日本の新しい報（${{ steps.check.outputs.new_list }}）" \
              --body-file pr.md
          fi
