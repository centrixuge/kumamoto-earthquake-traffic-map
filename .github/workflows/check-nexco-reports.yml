name: Check NEXCO reports

on:
  schedule:
    # 日本時間の 9:00 と 19:00（UTCの 0:00 と 10:00）。
    # GitHub Actionsのcronは混み具合で数分〜十数分遅れることがある。
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 新しい報が出ていればPDFを保存する。中身の転記はしない
      # （区間や日時の読み取りには判断が要るため、人が行う）。
      - name: Check NEXCO news releases
        id: check
        run: python scripts/check_nexco_reports.py | tee check.log

      # mainへ直接コミットせず、専用ブランチに載せてプルリクエストにする。
      # 出先からでも中身を見て、スマホのGitHubアプリでマージできる。
      - name: Open a pull request
        if: steps.check.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: auto/nexco-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/nexco_west_regulations
          git commit -m "NEXCO西日本の新しい報を保存（${{ steps.check.outputs.new_list }}）"
          git push --force-with-lease -u origin "$BRANCH"

          {
            echo "NEXCO西日本のニュースリリースに新しい報が出ていたので、PDFを"
            echo "\`data/nexco_west_regulations/\` に追加しました"
            echo "（${{ steps.check.outputs.new_list }}）。"
            echo ""
            echo "**このPRをマージしても、地図の規制はまだ変わりません。**"
            echo "通行止めの区間・日時・緊急車両の通行可能区間を読み取って"
            echo "\`data/nexco_regulations.json\` に転記すると反映されます"
            echo "（手順は docs/regulations.md）。PDFを先に取り込んでおくのは、"
            echo "配布元から消えても後から転記できるようにするためです。"
            echo ""
            echo "実行ログ:"
            echo '```'
            cat check.log
            echo '```'
          } > pr.md

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            # すでに開いているPRがあれば、そこに追記する（PRを増やさない）
            gh pr comment "$BRANCH" --body-file pr.md
          else
            gh pr create --base main --head "$BRANCH" \
              --title "NEXCO西日本の新しい報（${{ steps.check.outputs.new_list }}）" \
              --body-file pr.md
          fi
