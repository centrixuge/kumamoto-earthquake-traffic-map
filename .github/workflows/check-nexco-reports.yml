name: Check NEXCO reports

on:
  schedule:
    # 日本時間の 9:00 と 19:00（UTCの 0:00 と 10:00）。
    # GitHub Actionsのcronは混み具合で数分〜十数分遅れることがある。
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # developで作業する。確認用アプリ（PREVIEW_APP_URL）がこのブランチを
      # 映しているので、PRの内容をそのまま画面で確かめられる。
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF reader
        run: pip install pymupdf

      # 新しい報が出ていればPDFを保存する
      - name: Check NEXCO news releases
        id: check
        run: python scripts/check_nexco_reports.py | tee check.log

      # 読み取れる範囲（緊急車両の通行可能区間）だけをJSONに反映し、
      # 判断材料をPRの本文にまとめる。通行止めの追加・解除は触らない。
      - name: Apply the new reports
        if: steps.check.outputs.new_count != '0'
        env:
          # このブランチを映す確認用アプリのURL。リポジトリの Variables に
          # PREVIEW_APP_URL を作ると、PRの本文に出る（未設定なら出ない）。
          PREVIEW_APP_URL: ${{ vars.PREVIEW_APP_URL }}
        run: |
          : > pr.md
          # 保存したPDFのパスは check_nexco_reports.py が new_reports.txt に
          # 書いている。git status で拾う作りにすると、取り直したPDFが既存と
          # 同一バイトのときに検出できない。
          while IFS= read -r pdf; do
            [ -z "$pdf" ] && continue
            echo "--- $pdf"
            python scripts/apply_nexco_report.py "$pdf" --summary part.md
            cat part.md >> pr.md
            echo "" >> pr.md
          done < new_reports.txt

      # mainへ直接コミットせず、developに載せてプルリクエストにする。
      # 出先からでも確認用アプリで画面を見て、スマホのGitHubアプリで
      # マージできる。
      - name: Push and open a pull request
        if: steps.check.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nexco_west_regulations data/nexco_regulations.json
          git commit -m "NEXCO西日本の新しい報を反映（${{ steps.check.outputs.new_list }}）"
          git push origin develop

          {
            echo ""
            echo "<details><summary>取得の実行ログ</summary>"
            echo ""
            echo '```'
            cat check.log
            echo '```'
            echo ""
            echo "</details>"
          } >> pr.md

          if [ -n "$(gh pr list --head develop --base main --state open --json number -q '.[].number')" ]; then
            # すでに開いているPRがあれば、そこに追記する（PRを増やさない）
            gh pr comment develop --body-file pr.md
          else
            gh pr create --base main --head develop \
              --title "NEXCO西日本の新しい報（${{ steps.check.outputs.new_list }}）" \
              --body-file pr.md
          fi
